<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TauP Calculator</title>

    <!-- Apply the saved (or system) theme before first paint to avoid a flash -->
    <script>
      (function () {
        var theme = null;
        try { theme = localStorage.getItem("taup-theme"); } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>

    <style>
      :root {
        --myred: #FFB3BA;

        /* Dark theme (default) */
        --bg: #0d1117;
        --panel: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: var(--myred);
        --accent-text: var(--myred);      /* accent used as text on the page background */
        --on-accent: #2b0a0e;             /* text placed on top of the accent */
        --err: #ff7b72;
        --fig-bg: #000;
        color-scheme: dark;
      }

      :root[data-theme="light"] {
        --bg: #f6f8fa;
        --panel: #ffffff;
        --border: #d0d7de;
        --text: #1f2328;
        --muted: #59636e;
        --accent: var(--myred);
        --accent-text: var(--myred);
        --on-accent: #2b0a0e;
        --err: #cf222e;
        --fig-bg: #fff;
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: background 0.2s, color 0.2s;
      }

      main {
        max-width: 1000px;
        margin: 0 auto;
        padding: 32px 16px 64px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 24px;
      }

      h1 {
        font-size: 24px;
        margin: 0 0 4px;
      }

      h2 {
        font-size: 16px;
        margin: 0 0 12px;
      }

      .sub {
        color: var(--muted);
      }

      a {
        color: var(--accent-text);
      }

      code {
        color: var(--accent-text);
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 20px;
      }

      form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        align-items: end;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
      }

      input,
      select {
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 9px 10px;
        font: inherit;
      }

      input:focus,
      select:focus,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .wide {
        grid-column: 1 / -1;
      }

      button {
        background: var(--accent);
        color: var(--on-accent);
        border: 0;
        border-radius: 6px;
        padding: 10px 18px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      #theme-toggle {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
        font-weight: 500;
        padding: 7px 12px;
        white-space: nowrap;
        flex-shrink: 0;
      }

      #theme-toggle:hover {
        border-color: var(--accent);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }

      th,
      td {
        text-align: right;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
      }

      th:first-child,
      td:first-child {
        text-align: left;
      }

      th {
        color: var(--muted);
        font-weight: 500;
        font-size: 13px;
      }

      .scroll {
        overflow-x: auto;
      }

      pre {
        margin: 0;
        overflow-x: auto;
        color: var(--text);
        font-size: 13px;
      }

      .figs {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: 16px;
      }

      .figs img {
        width: 100%;
        aspect-ratio: 1 / 1;      /* every figure gets the same square box */
        object-fit: contain;      /* ...without stretching the image */
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--fig-bg);
      }

      .err {
        color: var(--err);
      }

      .muted {
        color: var(--muted);
      }

      @media (max-width: 480px) {
        .figs {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <header>
        <div>
          <h1>TauP Calculator</h1>
          <div class="sub">
            Seismic phase arrival times and ray paths, computed in Python with ObsPy's
            <a
              href="https://docs.obspy.org/packages/autogen/obspy.taup.tau.TauPyModel.html#obspy.taup.tau.TauPyModel"
              target="_blank"
              rel="noopener noreferrer"
            ><code>TauPyModel</code></a>.
          </div>
        </div>
        <button id="theme-toggle" type="button" aria-label="Toggle light and dark mode"></button>
      </header>

      <div class="card">
        <form id="form">
          <label>
            Velocity model
            <select id="model">
              <option value="ak135" selected>ak135</option>
              <option value="iasp91">iasp91</option>
              <option value="prem">prem</option>
            </select>
          </label>

          <label>
            Source depth (km)
            <input id="depth" type="number" min="0" step="any" value="100" required>
          </label>

          <label>
            Distance (degrees)
            <input id="dist" type="number" min="0" max="180" step="any" value="120" required>
          </label>

          <label class="wide">
            Phase list (comma-separated)
            <input id="phases" type="text" value="P, PcP, Pdiff, PKIKP" required>
          </label>

          <div>
            <button id="go" type="submit">Compute</button>
          </div>
        </form>
      </div>

      <div id="status" class="muted"></div>

      <div id="results" hidden>
        <div class="card">
          <h2>Arrivals</h2>
          <div class="scroll">
            <table>
              <thead>
                <tr>
                  <th>Phase</th>
                  <th>Time (s)</th>
                  <th>Time (min)</th>
                  <th>Ray param (s/°)</th>
                  <th>Takeoff (°)</th>
                  <th>Incident (°)</th>
                  <th>Distance (°)</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div id="none" class="muted" hidden>
            No arrivals found for these phases at this distance and depth.
          </div>
        </div>

        <!--
        <div class="card">
          <h2>Raw output</h2>
          <pre id="raw"></pre>
        </div>
        -->

        <div class="card">
          <h2>Figures</h2>
          <div class="figs" id="figs"></div>
        </div>
      </div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const root = document.documentElement;
      let hasResults = false;

      /* ---------- Theme ---------- */

      function currentTheme() {
        return root.getAttribute("data-theme") === "light" ? "light" : "dark";
      }

      function updateToggleLabel() {
        // Label names the mode you will switch to
        $("theme-toggle").textContent =
          currentTheme() === "dark" ? "☀ Light mode" : "☾ Dark mode";
      }

      $("theme-toggle").addEventListener("click", () => {
        const next = currentTheme() === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("taup-theme", next); } catch (e) {}
        updateToggleLabel();

        // Figures are rendered by the backend in the active theme, so redraw them
        if (hasResults) compute();
      });

      updateToggleLabel();

      /* ---------- Compute ---------- */

      $("form").addEventListener("submit", (e) => {
        e.preventDefault();
        compute();
      });

      async function compute() {
        const btn = $("go");
        const status = $("status");

        btn.disabled = true;
        status.className = "muted";
        status.textContent = "Computing…";

        const body = {
          model: $("model").value,
          source_depth_in_km: parseFloat($("depth").value),
          distance_in_degree: parseFloat($("dist").value),
          phase_list: $("phases").value
            .split(",")
            .map((s) => s.trim())
            .filter(Boolean),
          theme: currentTheme(),
        };

        try {
          const res = await fetch("/api/taup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || res.statusText);

          render(data);
          hasResults = true;
          status.textContent = "";
        } catch (err) {
          status.className = "err";
          status.textContent = "Error: " + err.message;
        } finally {
          btn.disabled = false;
        }
      }

      /* ---------- Render ---------- */

      function render({ arrivals, arrivals_text, figures }) {
        // The raw-output card is optional: skip it if it was removed or commented out
        const raw = $("raw");
        if (raw) raw.textContent = arrivals_text || "";

        const rows = $("rows");
        rows.innerHTML = "";
        arrivals.forEach((a) => {
          const tr = document.createElement("tr");
          const cells = [
            a.phase,
            a.time.toFixed(2),
            (a.time / 60).toFixed(2),
            a.ray_param.toFixed(3),
            a.takeoff.toFixed(2),
            a.incident.toFixed(2),
            a.distance.toFixed(2),
          ];
          cells.forEach((c) => {
            const td = document.createElement("td");
            td.textContent = c;
            tr.appendChild(td);
          });
          rows.appendChild(tr);
        });
        $("none").hidden = arrivals.length > 0;

        const figs = $("figs");
        figs.innerHTML = "";
        [
          ["rays_at_distance", "Ray paths at the chosen distance"],
          //["rays_all", "Ray paths over all distances"],
          ["times", "Travel-time curves"],
        ].forEach(([key, title]) => {
          if (figures[key]) {
            const img = new Image();
            img.src = "data:image/png;base64," + figures[key];
            img.alt = title;
            figs.appendChild(img);
          } else if (figures[key + "_error"]) {
            const p = document.createElement("p");
            p.className = "err";
            p.textContent = title + ": " + figures[key + "_error"];
            figs.appendChild(p);
          }
        });

        $("results").hidden = false;
      }
    </script>
  </body>
</html>
